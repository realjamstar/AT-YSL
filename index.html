        /* Smooth quote fade & rise animation */
        .quote-fade-in {
            animation: quoteFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes quoteFade {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Luxury Earth Tone Glassmorphism Card */
        .glass-card {
            background: rgba(30, 25, 22, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 196, 176, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        /* Gold glow hover effect */
        .btn-gold-glow {
            box-shadow: 0 4px 20px rgba(140, 109, 88, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-gold-glow:hover {
            box-shadow: 0 8px 30px rgba(184, 150, 110, 0.5);
            transform: translateY(-2px);
        }

        .gold-shimmer {
            background: linear-gradient(135deg, #f7f4ef 0%, #d4c4b0 50%, #8c6d58 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        // DOM Elements Selection
        const quoteContainer = document.getElementById('quote-container');
        const quoteText = document.getElementById('quote-text');
        const randomBtn = document.getElementById('random-btn');
        const copyBtn = document.getElementById('copy-btn');
        const shareBtn = document.getElementById('share-btn');
        const toast = document.getElementById('toast');

        let lastIndex = -1;

        // Randomize Quote Function
        function pickPerfectOne() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * quotes.length);
            } while (randomIndex === lastIndex && quotes.length > 1);

            lastIndex = randomIndex;
            const currentQuote = quotes[randomIndex];

            // Trigger animation smooth restart
            quoteContainer.classList.remove('quote-fade-in');
            void quoteContainer.offsetWidth; // Reflow reset

            quoteText.innerText = `"${currentQuote}"`;

            quoteContainer.classList.add('quote-fade-in');
        }

        // Show Toast Notification
        function showToast(message) {
            toast.querySelector('span').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 2200);
        }

        // Copy Text to Clipboard Function (แบบไม่ติดเครื่องหมาย " ")
function copyQuote() {
    // ดึงข้อความและลบเครื่องหมาย " ที่อยู่หน้าสุดและหลังสุดออก
    const textToCopy = quoteText.innerText.replace(/^"|"$/g, '');

    const textarea = document.createElement('textarea');
    textarea.value = textToCopy;
    document.body.appendChild(textarea);
    textarea.select();

    try {
        document.execCommand('copy');
        showToast("Copied quote to clipboard.");
    } catch (err) {
        showToast("Unable to copy text.");
    } finally {
        document.body.removeChild(textarea);
    }
}

        // Share to Twitter / X
        function shareToX() {
            const text = `${quoteText.innerText}\n\nHello? Who call me? Umm "YSL" ✨`;
            const encodedText = encodeURIComponent(text);
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodedText}`;
            window.open(twitterUrl, '_blank', 'width=600,height=450');
        }

        // Event Listeners
        randomBtn.addEventListener('click', pickPerfectOne);
        copyBtn.addEventListener('click', copyQuote);
        shareBtn.addEventListener('click', shareToX);

        window.onload = function() {
